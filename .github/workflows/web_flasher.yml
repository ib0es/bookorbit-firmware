name: Build & Deploy Web Flasher

# main / manual run -> build + deploy GitHub Pages
# tag v*            -> build + publish GitHub release, then re-run on main so
#                      Pages picks up the new release (Pages environments only
#                      accept the default branch by default).
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # create releases
  pages: write
  id-token: write
  actions: write    # dispatch the Pages run after a release

concurrency:
  group: web-flasher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web-flasher/package-lock.json'

      - name: Build Web Flasher React app
        working-directory: web-flasher
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO & esptool
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio esptool

      - name: Build and merge all firmware targets
        run: python3 tools/build_web_flasher.py

      - name: Upload firmware artifacts (all)
        uses: actions/upload-artifact@v4
        with:
          name: book-orbit-firmware-all
          path: docs/builds/*/bookorbit-*.bin

      - name: Upload firmware (Xteink X4)
        uses: actions/upload-artifact@v4
        with:
          name: bookorbit-x4
          path: docs/builds/x4/bookorbit-x4.bin

      - name: Upload firmware (Xteink X3)
        uses: actions/upload-artifact@v4
        with:
          name: bookorbit-x3
          path: docs/builds/x3/bookorbit-x3.bin

      - name: Upload firmware (Xteink X4 Classic)
        uses: actions/upload-artifact@v4
        with:
          name: bookorbit-x4c
          path: docs/builds/x4c/bookorbit-x4c.bin

      - name: Upload firmware (Xteink X4 Pro)
        uses: actions/upload-artifact@v4
        with:
          name: bookorbit-x4pro
          path: docs/builds/x4pro/bookorbit-x4pro.bin

      - name: Upload firmware (BOOX Picco)
        uses: actions/upload-artifact@v4
        with:
          name: bookorbit-picco
          path: docs/builds/picco/bookorbit-picco.bin

      # ---------- tag: publish release ----------
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: docs/builds/*/bookorbit-*.bin
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Redeploy Pages from main with the new release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "${{ github.workflow }}" --repo "${{ github.repository }}" --ref "${{ github.event.repository.default_branch }}"

      # ---------- main: publish / update rolling latest master release ----------
      - name: Update latest master release on GitHub
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${{ github.sha }}"
          git push origin latest --force

          cat << 'EOF' > /tmp/release_notes.md
          ### Book Orbit Firmware — Latest Master Build
          Automated rolling build from branch `${{ github.ref_name }}` (commit `${{ github.sha }}`).

          #### Direct Downloads (Ready to flash at offset 0x0):
          * **Xteink X4**: [bookorbit-x4.bin](https://github.com/${{ github.repository }}/releases/download/latest/bookorbit-x4.bin)
          * **Xteink X3**: [bookorbit-x3.bin](https://github.com/${{ github.repository }}/releases/download/latest/bookorbit-x3.bin)
          * **Xteink X4 Classic**: [bookorbit-x4c.bin](https://github.com/${{ github.repository }}/releases/download/latest/bookorbit-x4c.bin)
          * **Xteink X4 Pro**: [bookorbit-x4pro.bin](https://github.com/${{ github.repository }}/releases/download/latest/bookorbit-x4pro.bin)
          * **BOOX Picco**: [bookorbit-picco.bin](https://github.com/${{ github.repository }}/releases/download/latest/bookorbit-picco.bin)
          EOF

          if gh release view latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit latest --repo "${{ github.repository }}" \
              --title "Latest Master Build" \
              --notes-file /tmp/release_notes.md \
              --prerelease
            gh release upload latest docs/builds/*/bookorbit-*.bin --repo "${{ github.repository }}" --clobber
          else
            gh release create latest docs/builds/*/bookorbit-*.bin --repo "${{ github.repository }}" \
              --title "Latest Master Build" \
              --notes-file /tmp/release_notes.md \
              --prerelease
          fi

      # ---------- main: mirror releases & upload Pages ----------
      - name: Mirror release binaries for the flasher
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/collect_releases.py

      - name: Setup GitHub Pages
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
