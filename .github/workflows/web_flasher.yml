name: Build & Deploy Web Flasher

# main / manual run -> build + deploy GitHub Pages
# tag v*            -> build + publish GitHub release, then re-run on main so
#                      Pages picks up the new release (Pages environments only
#                      accept the default branch by default).
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # create releases
  pages: write
  id-token: write
  actions: write    # dispatch the Pages run after a release

concurrency:
  group: web-flasher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web-flasher/package-lock.json'

      - name: Build Web Flasher React app
        working-directory: web-flasher
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO & esptool
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio esptool

      - name: Build and merge all firmware targets
        run: python3 tools/build_web_flasher.py

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: book-orbit-firmware-all
          path: docs/builds/*/bookorbit-*.bin

      # ---------- tag: publish release ----------
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: docs/builds/*/bookorbit-*.bin
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Redeploy Pages from main with the new release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "${{ github.workflow }}" --repo "${{ github.repository }}" --ref "${{ github.event.repository.default_branch }}"

      # ---------- main: mirror releases & upload Pages ----------
      - name: Mirror release binaries for the flasher
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/collect_releases.py

      - name: Setup GitHub Pages
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
