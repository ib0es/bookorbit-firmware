; Book Orbit firmware — multi-device build.
; Plan: "Book Orbit: план поддержки x4 / x3 / x4c / x4pro / picco (v2)".
; Each device gets its own env; envs for x3, x4c, x4pro and picco are added
; in their own rollout stages.

[platformio]
default_envs = x4

; ---------------------------------------------------------------------------
; Shared by every device
; ---------------------------------------------------------------------------
[base]
; Espressif 32 8.0.0 = Arduino core 3.3.12 / ESP-IDF 5.5.5 (x4 build and
; flash verified on hardware, 2026-11-07).
platform = espressif32 @ 8.0.0
framework = arduino
board_build.flash_mode = dio
board_upload.flash_size = 16MB
monitor_speed = 115200
monitor_filters = direct, esp32_exception_decoder
build_flags =
    -std=gnu++2a
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
    -Iinclude
    -O2
    ; FreeInkBook (EPUB layout engine): small memory profile on every device,
    ; the one the simulator tests run (ESP32-C3 without PSRAM sets the bar).
    -DFREEINK_BOOK_SMALL=1
    ; SdFat over SPI moves whole buffers through SPIClass::transfer(buf, n)
    ; instead of one transfer(0xFF) call per byte (~0.5 MB/s on the X4 card).
    -DUSE_SPI_ARRAY_TRANSFER=1
build_unflags =
    -std=gnu++11
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    adafruit/Adafruit GFX Library@^1.11.9
    BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
    EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
    InputManager=symlink://freeink-sdk/libs/hardware/InputManager
    BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
    PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
    SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
    FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
    FreeInkFont=symlink://freeink-sdk/libs/font/FreeInkFont
    FreeInkBook=symlink://freeink-sdk/libs/book/FreeInkBook
    ; inert on boards without a frontlight (src/hal/frontlight.cpp compiles it in only with CAP_FRONTLIGHT)
    FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager
    XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect

; ---------------------------------------------------------------------------
; ESP32-C3 devices (Xteink X4, X3)
; ---------------------------------------------------------------------------
[c3_base]
extends = base
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.partitions = default_16MB.csv
upload_port = /dev/cu.usbmodem*

; --- Xteink X4 -> pio run -e x4 --------------------------------------------
[env:x4]
extends = c3_base
build_flags =
    ${base.build_flags}
    -DFREEINK_DEVICE_X4=1
    -DFREEINK_X4_FAST_DU_SHORTCUT=1
    -DFREEINK_X4_OVERCLOCK_SPI=1

; --- Xteink X3 (792x528, UC8253 / UC8279) -> pio run -e x3 --------------------
; Same C3 board and pinout as the X4; BQ27220 fuel gauge + DS3231 RTC on I2C.
; Display orientation and button mapping: PENDING validation on hardware.
[env:x3]
extends = c3_base
build_flags =
    ${base.build_flags}
    -DFREEINK_DEVICE_X3=1

; ---------------------------------------------------------------------------
; ESP32-S3 devices (X4 Classic; X4 Pro and Picco follow): 16 MB flash, 8 MB PSRAM
; ---------------------------------------------------------------------------
[s3_base]
extends = base
; Generic S3 board (platform 8.0.0 has no esp32-s3-devkitc1-n16r8), so the
; module's 16 MB flash and 8 MB octal PSRAM are spelled out: memory_type picks
; the precompiled SDK variant with OPI PSRAM enabled (DIO flash, as [base]).
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
upload_port = /dev/cu.usbmodem*
build_flags =
    ${base.build_flags}
    -DBOARD_HAS_PSRAM
    ; SD is native SDMMC (FREEINK_SD_SDMMC auto-enables); SdFat mounts it
    ; through its generic block-device interface.
    -DUSE_BLOCK_DEVICE_INTERFACE=1
    ; PSRAM holds the async baseline frame, so fast refreshes return at once.
    -DEPD_ASYNC_FAST_REFRESH=1

; --- Xteink X4 Classic (X4 V2: S3, 8 buttons, no touch/frontlight) -> pio run -e x4c
; Display SSD1677/UC8179/UC8279 (probed), CW2017 gauge + STAT GPIO21, BM8563 RTC,
; 1-bit SDMMC with active-low power GPIO6. PENDING on hardware: bottom-key
; mapping, GPIO4 role, STAT polarity, panel orientation.
[env:x4c]
extends = s3_base
build_flags =
    ${s3_base.build_flags}
    -DFREEINK_DEVICE_X4CLASSIC=1

; --- Xteink X4 Pro (S3, GT911 touch, warm/cool PWM frontlight) -> pio run -e x4pro
; SD: native SDMMC with active-low power GPIO5 (confirmed on hardware). Touch
; and frontlight auto-enable for this device. PENDING on hardware: frontlight
; GPIO/frequency, battery/VBUS pins, touch flipX/flipY (corner test).
[env:x4pro]
extends = s3_base
build_flags =
    ${s3_base.build_flags}
    -DFREEINK_DEVICE_X4PRO=1

; --- BOOX Picco / Tiles (S3, 8 MB octal PSRAM, TMA525C touch, I2C frontlight) -> pio run -e picco
; The developer's unit ran CrossPoint Reader (no Onyx factory image or safeboot
; left: flash dump of 2026-11-07, 8 MB Arduino layout nvs/otadata/app0/littlefs/
; coredump), so a normal full upload with the shared 16 MB layout is fine. To go
; back: esptool write-flash 0 <full dump>. PENDING on hardware: touch
; orientation (corner test), button roles, panel orientation, battery ADC.
[env:picco]
extends = s3_base
board_build.arduino.memory_type = dio_opi
build_flags =
    ${s3_base.build_flags}
    -DFREEINK_DEVICE_PICCO=1
