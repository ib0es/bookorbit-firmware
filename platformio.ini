; Book Orbit firmware — multi-device build.
; Plan: "Book Orbit: план поддержки x4 / x3 / x4c / x4pro / picco (v2)".
; Each device gets its own env; envs for x3, x4c, x4pro and picco are added
; in their own rollout stages.

[platformio]
default_envs = x4

; ---------------------------------------------------------------------------
; Shared by every device
; ---------------------------------------------------------------------------
[base]
; Espressif 32 8.0.0 = Arduino core 3.3.12 / ESP-IDF 5.5.5 (x4 build and
; flash verified on hardware, 2026-11-07).
platform = espressif32 @ 8.0.0
framework = arduino
; Rebuild window-dependent lwIP objects from checksum-verified, pinned SDK source.
extra_scripts = post:tools/pio_tcp_window.py
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = direct, esp32_exception_decoder
build_flags =
    -std=gnu++2a
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
    -Iinclude
    ; FreeInkBook (EPUB layout engine): small memory profile on devices without PSRAM
    -DFREEINK_BOOK_SMALL=1
    ; SdFat over SPI moves whole buffers through SPIClass::transfer(buf, n)
    ; instead of one transfer(0xFF) call per byte (~0.5 MB/s on the X4 card).
    -DUSE_SPI_ARRAY_TRANSFER=1
build_unflags =
    -std=gnu++11
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    adafruit/Adafruit GFX Library@^1.11.9
    BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
    EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
    InputManager=symlink://freeink-sdk/libs/hardware/InputManager
    BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
    PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
    SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
    FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
    FreeInkFont=symlink://freeink-sdk/libs/font/FreeInkFont
    FreeInkBook=symlink://freeink-sdk/libs/book/FreeInkBook
    ; inert on boards without a frontlight / RTC / IMU (compile-time stubbed via FREEINK_CAP_*)
    FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager
    Rtc=symlink://freeink-sdk/libs/hardware/Rtc
    Imu=symlink://freeink-sdk/libs/hardware/Imu
    XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
    UsbMassStorage=symlink://freeink-sdk/libs/hardware/UsbMassStorage

; ---------------------------------------------------------------------------
; ESP32-C3 devices (Xteink X4, X3)
; ---------------------------------------------------------------------------
[c3_base]
extends = base
custom_tcp_window = 16384
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.partitions = default_16MB.csv
upload_port = /dev/cu.usbmodem*
build_flags =
    ${base.build_flags}
    -DBOOKORBIT_TCP_WINDOW_TUNING=1
    -Os

; --- Xteink X4 -> pio run -e x4 --------------------------------------------
[env:x4]
extends = c3_base
build_flags =
    ${c3_base.build_flags}
    -DFREEINK_DEVICE_X4=1
    -DFREEINK_X4_FAST_DU_SHORTCUT=1
    -DFREEINK_X4_OVERCLOCK_SPI=1

; --- Xteink X3 (792x528, UC8253 / UC8279d) -> pio run -e x3 -------------------
; Same C3 board as X4; BQ27220 fuel gauge + DS3231 RTC + QMI8658 IMU on I2C.
[env:x3]
extends = c3_base
build_flags =
    ${c3_base.build_flags}
    -DFREEINK_DEVICE_X3=1

; ---------------------------------------------------------------------------
; ESP32-S3 devices (X4 Classic; X4 Pro and Picco follow): 16 MB flash, 8 MB PSRAM
; ---------------------------------------------------------------------------
[s3_base]
extends = base
custom_tcp_window = 32768
; Generic S3 board (platform 8.0.0 has no esp32-s3-devkitc1-n16r8), so the
; module's 16 MB flash and 8 MB octal PSRAM are spelled out: memory_type picks
; the precompiled SDK variant with OPI PSRAM enabled (DIO flash, as [base]).
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
upload_port = /dev/cu.usbmodem*
build_flags =
    ${base.build_flags}
    -DBOOKORBIT_TCP_WINDOW_TUNING=1
    -O2
    -DBOARD_HAS_PSRAM
    ; SD is native SDMMC (FREEINK_SD_SDMMC auto-enables); SdFat mounts it
    ; through its generic block-device interface.
    -DUSE_BLOCK_DEVICE_INTERFACE=1
    ; PSRAM holds the async baseline frame, so fast refreshes return at once.
    -DEPD_ASYNC_FAST_REFRESH=1

; --- Xteink X4 Classic (X4 V2: S3, 8 buttons, no touch/frontlight) -> pio run -e x4c
; Display SSD1677/UC8179/UC8279 (probed), CW2017 gauge + STAT GPIO21, BM8563 RTC,
; 1-bit SDMMC with active-low power GPIO6. PENDING on hardware: bottom-key
; mapping, GPIO4 role, STAT polarity, panel orientation.
[env:x4c]
extends = s3_base
build_flags =
    ${s3_base.build_flags}
    -DFREEINK_DEVICE_X4CLASSIC=1
    -DFREEINK_CAP_USB_MSC=1

; --- Xteink X4 Pro (S3, GT911 touch, warm/cool PWM frontlight) -> pio run -e x4pro
; SD: native SDMMC with active-low power GPIO5 (confirmed on hardware). Touch
; and frontlight auto-enable for this device. PENDING on hardware: frontlight
; GPIO/frequency, battery/VBUS pins, touch flipX/flipY (corner test).
[env:x4pro]
extends = s3_base
build_flags =
    ${s3_base.build_flags}
    -DFREEINK_DEVICE_X4PRO=1
    -DFREEINK_CAP_USB_MSC=1
    -DFREEINK_GT911_INT_WAKE=1

; --- BOOX Picco / Tiles (S3, 8 MB octal PSRAM, TMA525C touch, I2C frontlight) -> pio run -e picco
; The developer's unit ran CrossPoint Reader (no Onyx factory image or safeboot
; left: flash dump of 2026-11-07, 8 MB Arduino layout nvs/otadata/app0/littlefs/
; coredump), so a normal full upload with the shared 16 MB layout is fine. To go
; back: esptool write-flash 0 <full dump>. PENDING on hardware: touch
; orientation (corner test), button roles, panel orientation, battery ADC.
[env:picco]
extends = s3_base
board_build.arduino.memory_type = dio_opi
build_flags =
    ${s3_base.build_flags}
    -DFREEINK_DEVICE_PICCO=1

; --- de-link (ESP32-S3, 800x480, 7 keys, single-channel PWM frontlight) -> pio run -e delink
[env:delink]
extends = s3_base
build_flags =
    ${s3_base.build_flags}
    -DFREEINK_DEVICE_DELINK=1
    -DFREEINK_CAP_USB_MSC=1

; --- M5Stack Paper Mono (ESP32-S3, 800x480 SSD1677, FT6336, AW9967, PM1) -> pio run -e papermono
[env:papermono]
extends = s3_base
build_flags =
    ${s3_base.build_flags}
    -DFREEINK_DEVICE_PAPERMONO=1
    -DFREEINK_CAP_TOUCH=1
    -DFREEINK_CAP_USB_MSC=1

; --- Seeed reTerminal Sticky (ESP32-S3, 800x480 SSD1677, GT911, DigitalConfirmPowerHold) -> pio run -e sticky
[env:sticky]
extends = s3_base
build_unflags =
    -DUSE_BLOCK_DEVICE_INTERFACE=1
build_flags =
    ${s3_base.build_flags}
    -DFREEINK_DEVICE_STICKY=1
    -DFREEINK_CAP_TOUCH=1
    -DFREEINK_GT911_INT_WAKE=1

; --- Waveshare ESP32-S3-ePaper-3.97 (ESP32-S3, 800x480, 4 keys, AXP2101) -> pio run -e ws397
[env:ws397]
extends = s3_base
build_flags =
    ${s3_base.build_flags}
    -DFREEINK_DEVICE_WS397=1
    -DFREEINK_CAP_USB_MSC=1

; --- Metalio E-Ink 4 (ESP32-S3, 800x480, CST816S, TCA9555) -> pio run -e metalio_eink4
[env:metalio_eink4]
extends = s3_base
build_flags =
    ${s3_base.build_flags}
    -DFREEINK_DEVICE_METALIO_EINK4=1
    -DFREEINK_CAP_TOUCH=1
    -DFREEINK_CAP_USB_MSC=1

; --- Murphy M4 (ESP32-S3, 800x480, FT6336U, dual PWM frontlight) -> pio run -e murphy_m4
[env:murphy_m4]
extends = s3_base
build_flags =
    ${s3_base.build_flags}
    -DFREEINK_DEVICE_MURPHY_M4=1
    -DFREEINK_CAP_TOUCH=1
    -DFREEINK_CAP_USB_MSC=1

; --- EEGO Reader A4 (ESP32-S3, 768x552 UC8279C, GSLX680) -> pio run -e eego_a4
[env:eego_a4]
extends = s3_base
build_unflags =
    -DUSE_BLOCK_DEVICE_INTERFACE=1
build_flags =
    ${s3_base.build_flags}
    -DFREEINK_DEVICE_EEGO_A4=1
    -DFREEINK_CAP_TOUCH=1

; --- LilyGo T5 S3 (ESP32-S3, 960x540, GT911, BOOT only) -> pio run -e lilygo_t5s3
[env:lilygo_t5s3]
extends = s3_base
build_unflags =
    -DUSE_BLOCK_DEVICE_INTERFACE=1
build_flags =
    ${s3_base.build_flags}
    -DFREEINK_DEVICE_LILYGO=1
    -DFREEINK_CAP_TOUCH=1
    -DFREEINK_LGFX_EPD_CONFIG=lilygoT5S3LgfxConfig
lib_deps =
    ${s3_base.lib_deps}
    m5stack/M5GFX @ 0.2.33

; --- M5Stack PaperS3 (ESP32-S3, 960x540, 0 buttons, BoardPaperS3) -> pio run -e papers3
[env:papers3]
extends = s3_base
build_unflags =
    -DUSE_BLOCK_DEVICE_INTERFACE=1
build_flags =
    ${s3_base.build_flags}
    -DFREEINK_DEVICE_PAPERS3=1
    -DFREEINK_CAP_TOUCH=1
lib_deps =
    ${s3_base.lib_deps}
    BoardPaperS3=symlink://freeink-sdk/libs/hardware/BoardPaperS3
    m5stack/M5GFX @ 0.2.33
